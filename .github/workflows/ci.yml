name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check server
        run: npm run typecheck:server

      - name: Run tests
        run: npm test

      - name: Build (type-check + bundle)
        run: npm run build

      # Non-blocking: the codebase has known no-explicit-any lint debt.
      - name: Lint
        run: npm run lint
        continue-on-error: true
